<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-labelledby="ttl desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ttl">Reachable and unreachable queue states</title>
  <desc id="desc">Two rows of three-slot queue snapshots. Top row, reachable: back=2 with only 2 in slot 1 (after Enq 1, Enq 2, Deq); back=3 with NULL, 1, 2 (three enqueues, one dequeue); back=1 with every slot null (Enq then Deq; the marker never moves back). Bottom row, unreachable, offending slot ringed: back=1 with 2 in slot 1, the same array as the first reachable one but with the marker one short; back=3 with 1, NULL, 2, a hole in the middle, impossible because Deq empties the front first; back=0 with 1 in slot 0, impossible because nothing was ever claimed.</desc>
    <style>
    .ink    { fill: #1f2328; }
    .muted  { fill: #57606a; }
    .card   { fill: #f6f8fa; stroke: #d0d7de; }
    .bg     { fill: #ffffff; }
    .rule   { stroke: #d0d7de; }
    .inkst  { stroke: #1f2328; }
    .mutedst{ stroke: #57606a; }

    .red    { fill: #cf222e; }  .redst    { stroke: #cf222e; }
    .green  { fill: #1a7f37; }  .greenst  { stroke: #1a7f37; }
    .blue   { fill: #0969da; }  .bluest   { stroke: #0969da; }
    .yellow { fill: #9a6700; }  .yellowst { stroke: #9a6700; }
    .purple { fill: #8250df; }  .purplest { stroke: #8250df; }

    .redbg    { fill: #ffebe9; stroke: #cf222e; }
    .greenbg  { fill: #ddf4e4; stroke: #1a7f37; }
    .bluebg   { fill: #ddf4ff; stroke: #0969da; }
    .yellowbg { fill: #fff8c5; stroke: #9a6700; }
    .purplebg { fill: #fbefff; stroke: #8250df; }
    .greybg   { fill: #eaeef2; stroke: #8c959f; }

    @media (prefers-color-scheme: dark) {
      .ink    { fill: #e6edf3; }
      .muted  { fill: #8b949e; }
      .card   { fill: #161b22; stroke: #30363d; }
      .bg     { fill: #0d1117; }
      .rule   { stroke: #30363d; }
      .inkst  { stroke: #e6edf3; }
      .mutedst{ stroke: #8b949e; }

      .red    { fill: #f85149; }  .redst    { stroke: #f85149; }
      .green  { fill: #3fb950; }  .greenst  { stroke: #3fb950; }
      .blue   { fill: #58a6ff; }  .bluest   { stroke: #58a6ff; }
      .yellow { fill: #d29922; }  .yellowst { stroke: #d29922; }
      .purple { fill: #a371f7; }  .purplest { stroke: #a371f7; }

      .redbg    { fill: #2d1112; stroke: #f85149; }
      .greenbg  { fill: #12261b; stroke: #3fb950; }
      .bluebg   { fill: #0d2b4e; stroke: #58a6ff; }
      .yellowbg { fill: #2e2a10; stroke: #d29922; }
      .purplebg { fill: #21173a; stroke: #a371f7; }
      .greybg   { fill: #21262d; stroke: #6e7681; }
    }

    text  { font-size: 15px; }
    .h    { font-size: 17px; font-weight: 700; }
    .sm   { font-size: 12.5px; }
    .xs   { font-size: 11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .b    { font-weight: 700; }
  </style>

    <rect width="900" height="452" class="bg"/>
  <text x="40" y="34" class="h ink">Which snapshots can the queue actually be in?</text>
  <text x="40" y="56" class="sm muted">Every one of these is a legal array. Only the top row is reachable by Enq and Deq.</text>
  <rect x="28" y="84" width="844" height="160" rx="10" class="greenbg" stroke-width="1" opacity="0.55"/>
  <text x="44" y="108" class="sm b green">✓ can happen</text>
  <path d="M 168.0 132 L 180.0 132 L 174.0 141 z" class="green"/>
  <text x="184.0" y="140" class="xs green mono">back=2</text>
  <rect x="52" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="74.0" y="170" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="102" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="124.0" y="172" text-anchor="middle" class="sm mono ink b">2</text>
  <rect x="152" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="174.0" y="170" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="202" y="146" width="44" height="40" rx="5" fill="none" class="mutedst" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="52" y="210" class="sm ink">Enq(1); Enq(2); Deq()</text>
  <path d="M 498.0 132 L 510.0 132 L 504.0 141 z" class="green"/>
  <text x="514.0" y="140" class="xs green mono">back=3</text>
  <rect x="332" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="354.0" y="170" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="382" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="404.0" y="172" text-anchor="middle" class="sm mono ink b">1</text>
  <rect x="432" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="454.0" y="172" text-anchor="middle" class="sm mono ink b">2</text>
  <rect x="482" y="146" width="44" height="40" rx="5" fill="none" class="mutedst" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="332" y="210" class="sm ink">Enq(2); Enq(1); Enq(2); Deq()</text>
  <path d="M 678.0 132 L 690.0 132 L 684.0 141 z" class="green"/>
  <text x="694.0" y="140" class="xs green mono">back=1</text>
  <rect x="612" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="634.0" y="170" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="662" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="684.0" y="170" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="712" y="146" width="44" height="40" rx="5" class="card"/>
  <text x="734.0" y="170" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="762" y="146" width="44" height="40" rx="5" fill="none" class="mutedst" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="612" y="210" class="sm ink">Enq(1); Deq() — looks empty,</text>
  <text x="612" y="227" class="sm ink">but back never moves back</text>
  <rect x="28" y="268" width="844" height="160" rx="10" class="redbg" stroke-width="1" opacity="0.55"/>
  <text x="44" y="292" class="sm b red">✗ can never happen</text>
  <path d="M 118.0 316 L 130.0 316 L 124.0 325 z" class="red"/>
  <text x="134.0" y="324" class="xs red mono">back=1</text>
  <rect x="52" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="74.0" y="354" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="102" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="124.0" y="356" text-anchor="middle" class="sm mono ink b">2</text>
  <rect x="99" y="327" width="50" height="46" rx="7" fill="none" class="redst" stroke-width="2.4" stroke-dasharray="5 3"/>
  <rect x="152" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="174.0" y="354" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="202" y="330" width="44" height="40" rx="5" fill="none" class="mutedst" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="52" y="394" class="sm ink">same array, marker one short:</text>
  <text x="52" y="411" class="sm ink">2 sits past back</text>
  <path d="M 498.0 316 L 510.0 316 L 504.0 325 z" class="red"/>
  <text x="514.0" y="324" class="xs red mono">back=3</text>
  <rect x="332" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="354.0" y="356" text-anchor="middle" class="sm mono ink b">1</text>
  <rect x="382" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="404.0" y="354" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="379" y="327" width="50" height="46" rx="7" fill="none" class="redst" stroke-width="2.4" stroke-dasharray="5 3"/>
  <rect x="432" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="454.0" y="356" text-anchor="middle" class="sm mono ink b">2</text>
  <rect x="482" y="330" width="44" height="40" rx="5" fill="none" class="mutedst" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="332" y="394" class="sm ink">a hole in the middle: Deq</text>
  <text x="332" y="411" class="sm ink">always empties the front first</text>
  <path d="M 628.0 316 L 640.0 316 L 634.0 325 z" class="red"/>
  <text x="644.0" y="324" class="xs red mono">back=0</text>
  <rect x="612" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="634.0" y="356" text-anchor="middle" class="sm mono ink b">1</text>
  <rect x="609" y="327" width="50" height="46" rx="7" fill="none" class="redst" stroke-width="2.4" stroke-dasharray="5 3"/>
  <rect x="662" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="684.0" y="354" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="712" y="330" width="44" height="40" rx="5" class="card"/>
  <text x="734.0" y="354" text-anchor="middle" class="xs mono muted">NULL</text>
  <rect x="762" y="330" width="44" height="40" rx="5" fill="none" class="mutedst" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="612" y="394" class="sm ink">nothing was ever claimed,</text>
  <text x="612" y="411" class="sm ink">yet slot 0 is full</text>
</svg>
