<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>A crossing edge in A creates a cycle</title>
  <desc>Two panels. Left: A contains an edge that crosses the cut, so the cut does not respect A. Right: applying the cut property and adding the lightest crossing edge closes a four-vertex cycle that runs through the offending edge of A.</desc>

  <style>
    .ink-stroke   { stroke: #5F5E5A; }
    .ink-fill     { fill:   #3F3E3A; }
    .muted-fill   { fill:   #5F5E5A; }
    .node-fill    { fill:   #F1EFE8; }
    .cross-stroke { stroke: #C0532E; }
    .a-stroke     { stroke: #1E5AA8; }
    .a-fill       { fill:   #1E5AA8; }
    .s-stroke     { stroke: #0F6E56; }
    .vs-stroke    { stroke: #993C1D; }
    .s-fill       { fill:   #085041; }
    .vs-fill      { fill:   #712B13; }
    .s-region     { fill:   #E1F5EE; }
    .vs-region    { fill:   #FAECE7; }
    .cycle-fill   { fill:   #F5C7A8; }
    .bad-fill     { fill:   #C0532E; }
    .legend-text  { fill:   #3F3E3A; }

    .bg-fill      { fill:   #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      .ink-stroke   { stroke: #C8C5BC; }
      .ink-fill     { fill:   #E8E5DC; }
      .muted-fill   { fill:   #B8B5AC; }
      .node-fill    { fill:   #2A2A28; }
      .cross-stroke { stroke: #F0865B; }
      .a-stroke     { stroke: #7BB3F0; }
      .a-fill       { fill:   #9BC8F5; }
      .s-stroke     { stroke: #6FD4B5; }
      .vs-stroke    { stroke: #F0865B; }
      .s-fill       { fill:   #A8E8D2; }
      .vs-fill      { fill:   #F5B59A; }
      .s-region     { fill:   #1B3A33; }
      .vs-region    { fill:   #3A2620; }
      .cycle-fill   { fill:   #5C3520; }
      .bad-fill     { fill:   #F0865B; }
      .legend-text  { fill:   #E8E5DC; }
      .bg-fill      { fill:   #1A1A1A; }
    }
  </style>

  <rect width="100%" height="100%" class="bg-fill"/>

  <!-- Panel titles -->
  <text x="225" y="40" class="ink-fill" font-size="13" font-weight="500" text-anchor="middle">Step 1a: A contains a crossing edge</text>
  <text x="565" y="40" class="ink-fill" font-size="13" font-weight="500" text-anchor="middle">Step 1b: applying the cut property closes a cycle</text>

  <!-- ============ LEFT PANEL ============ -->

  <!-- S region -->
  <ellipse cx="150" cy="210" rx="56" ry="115"
           class="s-region s-stroke" stroke-width="1.2"
           stroke-dasharray="5 4" opacity="0.7"/>
  <text x="150" y="78" class="s-fill" font-size="14" font-weight="600" text-anchor="middle">S</text>

  <!-- V\S region -->
  <ellipse cx="300" cy="210" rx="56" ry="115"
           class="vs-region vs-stroke" stroke-width="1.2"
           stroke-dasharray="5 4" opacity="0.7"/>
  <text x="300" y="78" class="vs-fill" font-size="14" font-weight="600" text-anchor="middle">V \ S</text>

  <!-- A edges internal to S and V\S -->
  <g class="a-stroke" stroke-width="2.6" fill="none" stroke-linecap="round">
    <line x1="150" y1="130" x2="150" y2="290"/>  <!-- 1-6 -->
    <line x1="270" y1="210" x2="300" y2="290"/>  <!-- 4-5 -->
  </g>

  <!-- A edge that crosses (the violation): blue base + red dashed overlay -->
  <line x1="150" y1="130" x2="270" y2="210" class="a-stroke" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="150" y1="130" x2="270" y2="210" class="cross-stroke" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 5"/>

  <!-- Warning marker on the bad edge -->
  <circle cx="210" cy="170" r="10" class="bad-fill" opacity="0.95"/>
  <text x="210" y="170" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">!</text>

  <!-- Nodes in S -->
  <g class="node-fill s-stroke" stroke-width="1.1">
    <circle cx="150" cy="130" r="16"/>
    <circle cx="180" cy="210" r="16"/>
    <circle cx="150" cy="290" r="16"/>
  </g>
  <g class="ink-fill" font-size="13" text-anchor="middle" dominant-baseline="central">
    <text x="150" y="130">1</text>
    <text x="180" y="210">2</text>
    <text x="150" y="290">6</text>
  </g>

  <!-- Nodes in V\S -->
  <g class="node-fill vs-stroke" stroke-width="1.1">
    <circle cx="300" cy="130" r="16"/>
    <circle cx="270" cy="210" r="16"/>
    <circle cx="300" cy="290" r="16"/>
  </g>
  <g class="ink-fill" font-size="13" text-anchor="middle" dominant-baseline="central">
    <text x="300" y="130">3</text>
    <text x="270" y="210">4</text>
    <text x="300" y="290">5</text>
  </g>

  <!-- Caption (left panel) -->
  <text x="225" y="370" class="muted-fill" font-size="11" text-anchor="middle">
    A = {1–6, 1–4, 4–5}.  Edge 1–4 crosses the cut.
  </text>

  <!-- ============ RIGHT PANEL ============ -->

  <!-- S region -->
  <ellipse cx="490" cy="210" rx="56" ry="115"
           class="s-region s-stroke" stroke-width="1.2"
           stroke-dasharray="5 4" opacity="0.7"/>
  <text x="490" y="78" class="s-fill" font-size="14" font-weight="600" text-anchor="middle">S</text>

  <!-- V\S region -->
  <ellipse cx="640" cy="210" rx="56" ry="115"
           class="vs-region vs-stroke" stroke-width="1.2"
           stroke-dasharray="5 4" opacity="0.7"/>
  <text x="640" y="78" class="vs-fill" font-size="14" font-weight="600" text-anchor="middle">V \ S</text>

  <!-- Cycle highlight (drawn first, behind edges) -->
  <path d="M 490 130 L 610 210 L 640 290 L 490 290 Z"
        class="cycle-fill" stroke="none" opacity="0.55"/>

  <!-- A edges internal to S and V\S -->
  <g class="a-stroke" stroke-width="2.6" fill="none" stroke-linecap="round">
    <line x1="490" y1="130" x2="490" y2="290"/>  <!-- 1-6 -->
    <line x1="610" y1="210" x2="640" y2="290"/>  <!-- 4-5 -->
  </g>

  <!-- A edge that crosses -->
  <line x1="490" y1="130" x2="610" y2="210" class="a-stroke" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="490" y1="130" x2="610" y2="210" class="cross-stroke" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 5"/>

  <!-- Newly added lightest crossing edge -->
  <line x1="490" y1="290" x2="640" y2="290" class="cross-stroke" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Cycle label -->
  <text x="565" y="240" class="bad-fill" font-size="12" font-weight="600" text-anchor="middle" font-style="italic">cycle</text>

  <!-- Nodes in S -->
  <g class="node-fill s-stroke" stroke-width="1.1">
    <circle cx="490" cy="130" r="16"/>
    <circle cx="520" cy="210" r="16"/>
    <circle cx="490" cy="290" r="16"/>
  </g>
  <g class="ink-fill" font-size="13" text-anchor="middle" dominant-baseline="central">
    <text x="490" y="130">1</text>
    <text x="520" y="210">2</text>
    <text x="490" y="290">6</text>
  </g>

  <!-- Nodes in V\S -->
  <g class="node-fill vs-stroke" stroke-width="1.1">
    <circle cx="640" cy="130" r="16"/>
    <circle cx="610" cy="210" r="16"/>
    <circle cx="640" cy="290" r="16"/>
  </g>
  <g class="ink-fill" font-size="13" text-anchor="middle" dominant-baseline="central">
    <text x="640" y="130">3</text>
    <text x="610" y="210">4</text>
    <text x="640" y="290">5</text>
  </g>

  <!-- Caption (right panel) -->
  <text x="565" y="370" class="muted-fill" font-size="11" text-anchor="middle">
    Add lightest crossing edge 5–6.  Cycle 1 → 4 → 5 → 6 → 1 closes.
  </text>

  <!-- Legend -->
  <g font-size="11" dominant-baseline="central">
    <line x1="60" y1="408" x2="92" y2="408" class="a-stroke" stroke-width="2.6" stroke-linecap="round"/>
    <text x="100" y="408" class="legend-text">edge in A</text>

    <line x1="200" y1="408" x2="232" y2="408" class="a-stroke" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="200" y1="408" x2="232" y2="408" class="cross-stroke" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 5"/>
    <text x="240" y="408" class="legend-text">edge of A that crosses</text>

    <line x1="430" y1="408" x2="462" y2="408" class="cross-stroke" stroke-width="2.6" stroke-linecap="round"/>
    <text x="470" y="408" class="legend-text">lightest crossing edge added</text>

    <rect x="630" y="400" width="22" height="16" class="cycle-fill" opacity="0.55"/>
    <text x="660" y="408" class="legend-text">cycle</text>
  </g>

  <!-- Final caption -->
  <text x="380" y="445" class="muted-fill" font-size="12" text-anchor="middle">
    The cut does not respect A.  Adding the lightest crossing edge closes a cycle — A is no longer a forest, and no longer extendible to a tree.
  </text>
</svg>
