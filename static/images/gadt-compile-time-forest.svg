<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="ttl">
  <title id="ttl">Type-checking an expression tree at compile time: the walk halts the moment a bool turns up where an int expr was promised</title>
  <style>
    .txt   { fill: #1f2328; }
    .muted { fill: #57606a; }
    .card  { fill: #f6f8fa; stroke: #d0d7de; }
    .green { fill: #1a7f37; }
    .greenstroke { stroke: #1a7f37; }
    .red   { fill: #cf222e; }
    .redstroke { stroke: #cf222e; }
    .cardgreen { fill: #ddf4e4; stroke: #1a7f37; }
    .cardred   { fill: #ffebe9; stroke: #cf222e; }
    .edge      { stroke: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .txt   { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .card  { fill: #161b22; stroke: #30363d; }
      .green { fill: #3fb950; }
      .greenstroke { stroke: #3fb950; }
      .red   { fill: #f85149; }
      .redstroke { stroke: #f85149; }
      .cardgreen { fill: #12261b; stroke: #3fb950; }
      .cardred   { fill: #2d1112; stroke: #f85149; }
      .edge      { stroke: #3fb950; }
    }
    text { font-size: 14px; }
    .h   { font-size: 16px; font-weight: 700; }
    .sm  { font-size: 12px; }
    .tag { font-size: 11.5px; }
    .stop  { animation: pulse 1.6s ease-in-out infinite; }
    .badedge { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes dash  { to { stroke-dashoffset: -24; } }
  </style>

  <!-- ===================== header (two lines so the expr never overflows) ===================== -->
  <text x="40" y="32" class="h txt">Compile time: type-checking the expression tree</text>
  <text x="40" y="56" class="green">Add (Add (Int 4, Int 3), Add (Int 5, Bool true))</text>

  <!-- ===================== edges (drawn first, behind nodes) ===================== -->
  <line x1="440" y1="134" x2="240" y2="200" class="edge" stroke-width="2"/>
  <line x1="440" y1="134" x2="650" y2="200" class="edge" stroke-width="2"/>
  <line x1="240" y1="256" x2="150" y2="336" class="edge" stroke-width="2"/>
  <line x1="240" y1="256" x2="330" y2="336" class="edge" stroke-width="2"/>
  <line x1="650" y1="256" x2="560" y2="336" class="edge" stroke-width="2"/>
  <!-- the bad edge: right Add -> Bool true -->
  <line x1="650" y1="256" x2="745" y2="336" class="redstroke badedge" stroke-width="2.5"/>

  <!-- ===================== root ===================== -->
  <rect x="355" y="78" width="170" height="56" rx="8" class="cardgreen"/>
  <text x="375" y="104" class="green">Add</text>
  <text x="375" y="124" class="muted sm">: int expr  ✓</text>

  <!-- ===================== left Add ===================== -->
  <rect x="160" y="200" width="160" height="56" rx="8" class="cardgreen"/>
  <text x="180" y="226" class="green">Add</text>
  <text x="180" y="246" class="muted sm">: int expr  ✓</text>

  <!-- ===================== right Add ===================== -->
  <rect x="565" y="200" width="170" height="56" rx="8" class="card"/>
  <text x="585" y="226" class="txt">Add</text>
  <text x="585" y="246" class="muted sm">expects int expr</text>

  <!-- ===================== leaves ===================== -->
  <!-- Int 4 -->
  <rect x="85" y="336" width="130" height="62" rx="8" class="cardgreen"/>
  <text x="103" y="362" class="green">Int 4</text>
  <text x="103" y="382" class="muted sm">: int expr  ✓</text>

  <!-- Int 3 -->
  <rect x="265" y="336" width="130" height="62" rx="8" class="cardgreen"/>
  <text x="283" y="362" class="green">Int 3</text>
  <text x="283" y="382" class="muted sm">: int expr  ✓</text>

  <!-- Int 5 -->
  <rect x="495" y="336" width="130" height="62" rx="8" class="cardgreen"/>
  <text x="513" y="362" class="green">Int 5</text>
  <text x="513" y="382" class="muted sm">: int expr  ✓</text>

  <!-- Bool true (the offender) -->
  <rect x="665" y="336" width="160" height="62" rx="8" class="cardred"/>
  <text x="683" y="362" class="red">Bool true</text>
  <text x="683" y="382" class="red sm">: bool expr  ✗</text>

  <!-- STOP marker on the bad edge -->
  <g class="stop">
    <circle cx="700" cy="298" r="17" class="cardred redstroke" stroke-width="2"/>
    <text x="700" y="303" text-anchor="middle" class="red" font-weight="700">STOP</text>
  </g>

  <!-- ===================== compile-error callout (sized to its longest line) ===================== -->
  <rect x="435" y="430" width="405" height="132" rx="10" class="cardred"/>
  <text x="455" y="458" class="red" font-weight="700">Compile error</text>
  <text x="455" y="480" class="muted sm">the walk never reaches runtime</text>
  <text x="455" y="506" class="red sm">This expression has type  bool expr</text>
  <text x="455" y="524" class="red sm">but an expression was expected of type  int expr</text>
  <text x="455" y="548" class="muted tag">Add needs int expr on both sides; bool breaks it.</text>

  <!-- ===================== left caption ===================== -->
  <text x="40" y="452" class="muted sm">The type checker walks the whole forest of</text>
  <text x="40" y="472" class="muted sm">subexpressions. Every green edge keeps the</text>
  <text x="40" y="492" class="muted sm">promise  int expr.  The instant one edge</text>
  <text x="40" y="512" class="muted sm">would carry a  bool expr  into an  int expr</text>
  <text x="40" y="532" class="muted sm">slot, the check halts. Nothing is evaluated —</text>
  <text x="40" y="552" class="green sm">the bug dies at your desk, not at 3 a.m.</text>
</svg>
