  <defs>
    <marker id="ar-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="muted"/>
    </marker>
  </defs>
  <rect width="900" height="326" class="bg"/>
  <text x="40" y="34" class="h ink">Enq and Deq, one step at a time</text>
<g class="fade"><text class="sm muted w1" x="40" y="62" opacity="0">Empty: back = 0, every slot null.</text>
<text class="sm muted w2" x="40" y="62" opacity="0">Enq(1) · i := back;  back := back + 1   — slot 0 is claimed</text>
<text class="sm muted w3" x="40" y="62" opacity="0">Enq(1) · items[0] := 1</text>
<text class="sm muted w4" x="40" y="62" opacity="0">Enq(2) · i := back;  back := back + 1   — slot 1 is claimed</text>
<text class="sm muted w5" x="40" y="62" opacity="0">Enq(2) · items[1] := 2</text>
<text class="sm muted w6" x="40" y="62" opacity="0">Deq() · scan from the front for the first non-null slot</text>
<text class="sm muted w7" x="40" y="62" opacity="0">Deq() · null it out and return it. back does not move.</text>
<text class="sm muted w8" x="40" y="62" opacity="1">Each green box is a state. The row of them is one run.</text>
<rect x="330" y="112" width="70" height="56" rx="6" class="card" stroke-width="1.4"/>
<rect x="410" y="112" width="70" height="56" rx="6" class="card" stroke-width="1.4"/>
<rect x="490" y="112" width="70" height="56" rx="6" class="card" stroke-width="1.4"/>
<rect x="570" y="112" width="70" height="56" rx="6" fill="none" class="mutedst" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
<text x="365.0" y="188" text-anchor="middle" class="xs muted mono">0</text>
<text x="445.0" y="188" text-anchor="middle" class="xs muted mono">1</text>
<text x="525.0" y="188" text-anchor="middle" class="xs muted mono">2</text>
<text x="605.0" y="188" text-anchor="middle" class="xs muted mono">3</text>
<text x="655.0" y="148" class="h muted">…</text>
<text x="310" y="146" text-anchor="end" class="sm muted mono">items</text>
<rect class="yellowst w9" x="327" y="109" width="76" height="62" rx="8" fill="none" stroke-width="2.4" stroke-dasharray="6 4" opacity="0"/><text class="xs yellow w10" x="365.0" y="208" text-anchor="middle" opacity="0">claimed, still null</text>
<rect class="yellowst w11" x="407" y="109" width="76" height="62" rx="8" fill="none" stroke-width="2.4" stroke-dasharray="6 4" opacity="0"/><text class="xs yellow w12" x="445.0" y="208" text-anchor="middle" opacity="0">claimed, still null</text>
<rect class="bluest w13" x="326" y="108" width="78" height="64" rx="9" fill="none" stroke-width="3" opacity="0"/>
<text class="sm muted mono w14" x="365.0" y="145" text-anchor="middle" opacity="0">NULL</text>
<text class="h ink mono w15" x="365.0" y="148" text-anchor="middle" opacity="0">1</text>
<text class="sm muted mono w16" x="365.0" y="145" text-anchor="middle" opacity="1">NULL</text>
<text class="sm muted mono w17" x="445.0" y="145" text-anchor="middle" opacity="0">NULL</text>
<text class="h ink mono w18" x="445.0" y="148" text-anchor="middle" opacity="1">2</text>
<text x="525.0" y="145" text-anchor="middle" class="sm muted mono" opacity="1">NULL</text>
<text class="sm blue mono b w19" x="310" y="208" text-anchor="end" opacity="1">Deq() → 1</text>
<g class="mv" style="transform: translateX(160px)"><path d="M 358.0 96 L 372.0 96 L 365.0 106 z" class="red"/><text x="365.0" y="90" text-anchor="middle" class="sm red mono b">back</text></g>
<text x="40" y="248" class="xs muted">the run so far — one state after each whole operation</text>
<g class="w20" opacity="1"><rect x="40" y="262" width="170" height="40" rx="6" class="greenbg" stroke-width="1.2"/><text x="125" y="287" text-anchor="middle" class="xs ink mono">back=0 [NULL NULL NULL]</text></g>
<line class="mutedst w22" x1="216" y1="282" x2="244" y2="282" stroke-width="1.6" marker-end="url(#ar-m)" opacity="1"/><g class="w21" opacity="1"><rect x="250" y="262" width="170" height="40" rx="6" class="greenbg" stroke-width="1.2"/><text x="335" y="287" text-anchor="middle" class="xs ink mono">back=1 [1 NULL NULL]</text></g>
<line class="mutedst w24" x1="426" y1="282" x2="454" y2="282" stroke-width="1.6" marker-end="url(#ar-m)" opacity="1"/><g class="w23" opacity="1"><rect x="460" y="262" width="170" height="40" rx="6" class="greenbg" stroke-width="1.2"/><text x="545" y="287" text-anchor="middle" class="xs ink mono">back=2 [1 2 NULL]</text></g>
<line class="mutedst w26" x1="636" y1="282" x2="664" y2="282" stroke-width="1.6" marker-end="url(#ar-m)" opacity="1"/><g class="w25" opacity="1"><rect x="670" y="262" width="170" height="40" rx="6" class="greenbg" stroke-width="1.2"/><text x="755" y="287" text-anchor="middle" class="xs ink mono">back=2 [NULL 2 NULL]</text></g></g>
</svg>
