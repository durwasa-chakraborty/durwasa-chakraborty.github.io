<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" role="img" aria-labelledby="ttl desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ttl">Enq and Deq on a three-slot queue</title>
  <desc id="desc">Animated. A three-slot array starts empty with back at 0. Enq(1) first claims slot 0 by moving back to 1, then writes 1 into it. Enq(2) claims slot 1 and writes 2. Deq scans from the front, finds 1 in slot 0, nulls it and returns it; back stays at 2. Underneath, a row of states builds up after each whole operation: back=0 with all slots null, back=1 with 1 in slot 0, back=2 with 1 and 2, back=2 with only 2 in slot 1.</desc>
    <style>
    .ink    { fill: #1f2328; }
    .muted  { fill: #57606a; }
    .card   { fill: #f6f8fa; stroke: #d0d7de; }
    .bg     { fill: #ffffff; }
    .rule   { stroke: #d0d7de; }
    .inkst  { stroke: #1f2328; }
    .mutedst{ stroke: #57606a; }

    .red    { fill: #cf222e; }  .redst    { stroke: #cf222e; }
    .green  { fill: #1a7f37; }  .greenst  { stroke: #1a7f37; }
    .blue   { fill: #0969da; }  .bluest   { stroke: #0969da; }
    .yellow { fill: #9a6700; }  .yellowst { stroke: #9a6700; }
    .purple { fill: #8250df; }  .purplest { stroke: #8250df; }

    .redbg    { fill: #ffebe9; stroke: #cf222e; }
    .greenbg  { fill: #ddf4e4; stroke: #1a7f37; }
    .bluebg   { fill: #ddf4ff; stroke: #0969da; }
    .yellowbg { fill: #fff8c5; stroke: #9a6700; }
    .purplebg { fill: #fbefff; stroke: #8250df; }
    .greybg   { fill: #eaeef2; stroke: #8c959f; }

    @media (prefers-color-scheme: dark) {
      .ink    { fill: #e6edf3; }
      .muted  { fill: #8b949e; }
      .card   { fill: #161b22; stroke: #30363d; }
      .bg     { fill: #0d1117; }
      .rule   { stroke: #30363d; }
      .inkst  { stroke: #e6edf3; }
      .mutedst{ stroke: #8b949e; }

      .red    { fill: #f85149; }  .redst    { stroke: #f85149; }
      .green  { fill: #3fb950; }  .greenst  { stroke: #3fb950; }
      .blue   { fill: #58a6ff; }  .bluest   { stroke: #58a6ff; }
      .yellow { fill: #d29922; }  .yellowst { stroke: #d29922; }
      .purple { fill: #a371f7; }  .purplest { stroke: #a371f7; }

      .redbg    { fill: #2d1112; stroke: #f85149; }
      .greenbg  { fill: #12261b; stroke: #3fb950; }
      .bluebg   { fill: #0d2b4e; stroke: #58a6ff; }
      .yellowbg { fill: #2e2a10; stroke: #d29922; }
      .purplebg { fill: #21173a; stroke: #a371f7; }
      .greybg   { fill: #21262d; stroke: #6e7681; }
    }

    text  { font-size: 15px; }
    .h    { font-size: 17px; font-weight: 700; }
    .sm   { font-size: 12.5px; }
    .xs   { font-size: 11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .b    { font-weight: 700; }
  
