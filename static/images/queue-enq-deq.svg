    .w10 { animation: w10 16.0s linear infinite; }
    @keyframes w11 { 0% { opacity: 0; } 37.500% { opacity: 0; } 38.438% { opacity: 1; } 45.938% { opacity: 1; } 46.875% { opacity: 0; } 100% { opacity: 0; } }
    .w11 { animation: w11 16.0s linear infinite; }
    @keyframes w12 { 0% { opacity: 0; } 37.500% { opacity: 0; } 38.438% { opacity: 1; } 45.938% { opacity: 1; } 46.875% { opacity: 0; } 100% { opacity: 0; } }
    .w12 { animation: w12 16.0s linear infinite; }
    @keyframes w13 { 0% { opacity: 0; } 59.375% { opacity: 0; } 60.312% { opacity: 1; } 67.812% { opacity: 1; } 68.750% { opacity: 0; } 100% { opacity: 0; } }
    .w13 { animation: w13 16.0s linear infinite; }
    @keyframes w14 { 0% { opacity: 1; } 20.938% { opacity: 1; } 21.875% { opacity: 0; } 100% { opacity: 0; } }
    .w14 { animation: w14 16.0s linear infinite; }
    @keyframes w15 { 0% { opacity: 0; } 21.875% { opacity: 0; } 22.812% { opacity: 1; } 64.688% { opacity: 1; } 65.625% { opacity: 0; } 100% { opacity: 0; } }
    .w15 { animation: w15 16.0s linear infinite; }
    @keyframes w16 { 0% { opacity: 0; } 65.625% { opacity: 0; } 66.562% { opacity: 1; } 100% { opacity: 1; } }
